<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio14</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
        }
        th , tr, td{
            border: 1px solid gray;
            padding: 10px;
            text-align: center;
        }
        .titulo{
            background-color: rgb(98, 99, 93);
            color: rgb(255, 255, 253);
        }
        .diciplina{
            text-align: left;
        }
        #Media {
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th class="titulo" rowspan="2" scope="col">Área</th>
            <th class="titulo" rowspan="2" scope="col">Diciplina</th>
            <th class="titulo" colspan="2" scope="colgroup">Notas</th>
            <th class="titulo" rowspan="2" scope="col">Média</th>
        </tr>
        <tr>
            <th class="titulo" scope="col">Nota 1</th>
            <th class="titulo" scope="col">Nota 2</th>
        </tr>
        <tr>
            <th rowspan="4" scope="rowgroup">Extras</th>
            <td class="diciplina">Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td class="diciplina">Fisica</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td class="diciplina">Quimica</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td class="diciplina">Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th class="titulo" id="Media" colspan="4" scope="row">Média de Exatas</th>
            <th class="titulo">0.0</th>
        </tr>
        <tr>
            <th rowspan="2" scope="rowgroup">Humanas</th>
            <td class="diciplina">História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td class="diciplina">Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th class="titulo" id="Media" colspan="4" scope="row">Média de Humanas</th>
            <th class="titulo">0.0</th>
        </tr>
    </table>
</body>
</html>
